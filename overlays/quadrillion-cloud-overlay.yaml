overlay: 1.0.0
info:
  title: API Evangelist enhancements for Quadrillion Cloud API
  version: 1.0.0
extends: openapi/quadrillion-cloud-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: quadrillion
      x-apievangelist-product: Qualia
      x-apievangelist-auth: api-key + workos-sso-session
      x-apievangelist-error-format: fastapi-validation
      x-apievangelist-base-url: https://api.quadrillion.io
  - target: $.servers
    update:
      - url: https://api.quadrillion.io
        description: Quadrillion Cloud API production host (added by API Evangelist; absent from source spec)
