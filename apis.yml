name: Quadrillion
description: >-
  Quadrillion Labs builds Qualia, an AI coding agent for researchers that runs
  hundreds of agents in parallel to compress weeks of research into hours. Qualia
  is a Jupyter-compatible notebook IDE with autonomous mode, a central knowledge
  graph, reusable skills, and MCP integrations to tools like Snowflake, arXiv,
  Google Drive, Slack, and Atlassian. The Quadrillion Cloud API is the public
  cloud backend behind the desktop app, exposing cloud-safe endpoints for LLM
  provider proxying (OpenAI, Anthropic, Gemini, Cerebras, OpenRouter, Fireworks),
  API-key and session management, org/WorkOS SSO administration, compute and
  kernel orchestration, notebooks, projects/tasks, the knowledge graph, and
  Stripe billing.
