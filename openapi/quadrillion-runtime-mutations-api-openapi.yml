          type: string
          minLength: 1
          title: Notebook Path
        cursor_position:
          type: integer
          minimum: 0.0
          title: Cursor Position
        current_cell_content:
          type: string
          title: Current Cell Content
        current_cell_id:
          type: string
          minLength: 1
          title: Current Cell Id
        language:
          type: string
          minLength: 1
          title: Language
        cells:
          items:
            $ref: '#/components/schemas/Cell'
          type: array
          title: Cells
      type: object
      required:
      - notebook_id
      - notebook_path
      - cursor_position
      - current_cell_content
      - current_cell_id
      - language
      title: AutocompleteRequest
    TabularSortRequest:
      properties:
        sort:
