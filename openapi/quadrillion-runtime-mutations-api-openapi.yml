components:
  schemas:
    _TagDeleteRequest:
      properties:
        display_name:
          type: string
          title: Display Name
      type: object
      required:
      - display_name
      title: _TagDeleteRequest
    _CellPatchRequest:
      properties:
        notebook_id:
          type: string
          title: Notebook Id
        notebook_path:
          type: string
          title: Notebook Path
        cell_id:
          type: string
          title: Cell Id
        content:
          type: string
          title: Content
      type: object
      required:
      - notebook_id
      - notebook_path
      - cell_id
      - content
      title: _CellPatchRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    _BashAllowlistAddRequest:
      properties:
        command:
          type: string
          title: Command
        approved_tokens:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Approved Tokens
      type: object
      required:
      - command
      title: _BashAllowlistAddRequest
    RuleType:
      type: string
      enum:
      - always
      - manual
      title: RuleType
    _WorkspaceSwitchRequest:
      properties:
        path:
          type: string
          minLength: 1
          title: Path
        initiator_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Initiator Id
      type: object
      required:
      - path
      title: _WorkspaceSwitchRequest
    _TagUpdateRequest:
      properties:
        display_name:
          type: string
          title: Display Name
        description:
          type: string
          title: Description
      type: object
