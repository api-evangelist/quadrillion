openapi: 3.2.0
info:
  title: Quadrillion Cloud User API
  description: Public cloud API service for cloud-safe backend endpoints
  version: 0.1.0
tags:
- name: User
paths:
  /api/user/profile:
    get:
      tags:
      - User
      summary: Get User Profile
      description: 'Get the authenticated user''s profile.


        Requires: JWT token (session cookie or Authorization header)


        Returns:

        {

        "id": 123,

        "email": "user@example.com",

        "name": "John Doe",

        "created_at": "2025-01-15T10:30:00Z",

        "last_login": "2025-01-16T14:20:00Z"

        }'
      operationId: get_user_profile_api_user_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
components:
  schemas:
    UserProfileResponse:
      properties:
        id:
          type: integer
          title: Id
        email:
          type: string
          title: Email
        name:
          type: string
          title: Name
        created_at:
          type: string
          title: Created At
        last_login:
          type: string
          title: Last Login
      type: object
      required:
      - id
      - email
      - name
      - created_at
      - last_login
      title: UserProfileResponse
      description: Response model for user profile.
