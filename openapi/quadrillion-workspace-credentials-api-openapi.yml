openapi: 3.1.0
info:
  title: Quadrillion Cloud account workspace-credentials API
  description: Public cloud API service for cloud-safe backend endpoints
  version: 0.1.0
tags:
- name: workspace-credentials
paths:
  /api/workspace/credentials:
    post:
      tags:
      - workspace-credentials
      summary: Vend Credentials
      description: Vend scoped credentials for the authenticated user's workspace.
      operationId: vend_credentials_api_workspace_credentials_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CredentialRequestBody'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CredentialRequestBody:
      properties:
        dataset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Id
      type: object
      title: CredentialRequestBody
      description: Optional dataset target; absent means the caller's own workspace (RW).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
