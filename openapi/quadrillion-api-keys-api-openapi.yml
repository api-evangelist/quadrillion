openapi: 3.2.0
info:
  title: Quadrillion Cloud API Keys API
  description: Public cloud API service for cloud-safe backend endpoints
  version: 0.1.0
tags:
- name: API Keys
paths:
  /api/keys:
    get:
      tags:
      - API Keys
      summary: List Api Keys
      description: 'List all API keys for the authenticated user.


        Requires: JWT token (session cookie or Authorization header)


        Returns:

        [

        {

        "id": 123,

        "name": "Production Key",

        "prefix": "qd_live_abc123",

        "created_at": "2025-01-15T10:30:00Z",

        "last_used": "2025-01-16T14:20:00Z",

        "revoked": false

        }

        ]


        Note: Full API keys are not returned for security.'
      operationId: list_api_keys_api_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ListKeyResponse'
                type: array
                title: Response List Api Keys Api Keys Get
    post:
      tags:
      - API Keys
      summary: Create Api Key
      description: 'Create a new API key for the authenticated user.


        Requires: JWT token (session cookie or Authorization header)


        Request body:

        {

        "name": "Production Key"

        }


        Returns:

        {

        "id": 123,

        "key": "qd_live_abc123...",

        "name": "Production Key",

        "created_at": "2025-01-15T10:30:00Z",

        "warning": "Save this key now. You won''t be able to see it again!"

        }


        Note: The full API key is only shown once. Store it securely!'
      operationId: create_api_key_api_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/keys/validate:
    post:
      tags:
      - API Keys
      summary: Validate Api Key
      description: 'Validate an API key and check if it belongs to an associated user.


        Request body:

        {

        "key": "qd_live_abc123..."

        }


        Returns:

        {

        "valid": true

        }


        Note: Returns true if the key is valid and not revoked, false otherwise.'
      operationId: validate_api_key_api_keys_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateKeyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/keys/{key_id}:
    delete:
      tags:
      - API Keys
      summary: Delete Api Key
      description: 'Delete (revoke) an API key.


        Requires: JWT token (session cookie or Authorization header)


        Path parameters:

        key_id: The ID of the API key to delete


        Returns:

        204 No Content on success


        Raises:

        404: If key not found or not owned by user'
      operationId: delete_api_key_api_keys__key_id__delete
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: integer
          title: Key Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidateKeyResponse:
      properties:
        valid:
          type: boolean
          title: Valid
      type: object
      required:
      - valid
      title: ValidateKeyResponse
      description: Response model for API key validation.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    CreateKeyResponse:
      properties:
        id:
          type: integer
          title: Id
        key:
          type: string
          title: Key
        name:
          type: string
          title: Name
        created_at:
          type: string
          title: Created At
        warning:
          type: string
          title: Warning
          default: Save this key now. You won't be able to see it again!
      type: object
      required:
      - id
      - key
      - name
      - created_at
      title: CreateKeyResponse
      description: Response model for created API key.
    ListKeyResponse:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
        created_at:
          type: string
          title: Created At
        last_used:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Used
        revoked:
          type: boolean
          title: Revoked
      type: object
      required:
      - id
      - name
      - prefix
      - created_at
      - last_used
      - revoked
      title: ListKeyResponse
      description: Response model for listing API keys.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidateKeyRequest:
      properties:
        key:
          type: string
          title: Key
      type: object
      required:
      - key
      title: ValidateKeyRequest
      description: Request model for validating an API key.
    CreateKeyRequest:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: CreateKeyRequest
      description: Request model for creating an API key.
