openapi: 3.2.0
info:
  title: Quadrillion Cloud Releases API
  description: Public cloud API service for cloud-safe backend endpoints
  version: 0.1.0
tags:
- name: Releases
paths:
  /v1/releases/supported-platforms:
    get:
      tags:
      - Releases
      summary: Get Supported Platforms
      description: 'Get list of currently supported platform IDs.


        This endpoint returns which platforms have releases available for download.

        The frontend uses this to gray out unsupported platforms in the download UI.


        This is public data for the marketing download page, so no authentication

        is required. CDN-friendly caching is enabled to reduce backend load.


        Returns:

        SupportedPlatformsResponse with list of supported platform IDs


        Example:

        GET /v1/releases/supported-platforms


        Response:

        {

        "supported": [

        "macos-intel",

        "macos-apple-silicon",

        "windows-x64",

        "linux-x64"

        ]

        }'
      operationId: get_supported_platforms_v1_releases_supported_platforms_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedPlatformsResponse'
  /v1/releases/{filename}:
    get:
      tags:
      - Releases
      summary: Download Release
      description: 'Get a presigned S3 URL and redirect the user''s browser to download directly from S3.


        This endpoint validates the file exists, generates a short-lived presigned

        URL (1 minute), and redirects the browser to download directly from S3

        (avoiding bandwidth costs on backend and Vercel).


        Files are stored gzipped on S3 with Content-Encoding metadata (no extra .gz

        suffix on the S3 key). Browsers and HTTP clients automatically decompress

        during download, saving 30-60% bandwidth.


        Args:

        filename: Name of the release file to download

        request: FastAPI request object (to access app state)


        Returns:

        RedirectResponse to presigned S3 URL (browser downloads directly)


        Examples:

        GET /v1/releases/qualia-v1.2.3-macos-apple-silicon.app


        Response: 307 Redirect to https://bucket.s3.amazonaws.com/qualia-v1.2.3-macos-apple-silicon.app?X-Amz-...'
      operationId: download_release_v1_releases__filename__get
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SupportedPlatformsResponse:
      properties:
        supported:
          items:
            type: string
            enum:
            - macos-intel
            - macos-apple-silicon
            - windows-x64
            - windows-arm64
            - linux-x64
            - linux-arm64
          type: array
          title: Supported
      type: object
      required:
      - supported
      title: SupportedPlatformsResponse
      description: Response model for supported platforms endpoint.
