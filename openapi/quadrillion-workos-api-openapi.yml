openapi: 3.2.0
info:
  title: Quadrillion Cloud Workos API
  description: Public cloud API service for cloud-safe backend endpoints
  version: 0.1.0
tags:
- name: workos
paths:
  /api/auth/workos/start:
    get:
      tags:
      - workos
      summary: Start
      description: 'Build the WorkOS authorization URL and redirect.


        * ``org_slug`` — when present, the start endpoint looks up the

        Organization''s WorkOS organization id and routes through the

        tenant SSO connection. When absent, falls back to personal

        Google OAuth via WorkOS''s built-in ``GoogleOAuth`` provider.

        * ``frontend_origin`` — explicit browser origin. Required for

        browser logins and must match ``ALLOWED_FRONTEND_ORIGINS``. Used

        to pick the callback host for dashboard-vs-cloud logins.

        * ``next`` — post-login redirect target on the frontend. Validated

        to root-relative paths only.

        * ``callback_port`` — when present, the success path will redirect

        to ``http://localhost:/callback`` instead of setting a

        browser cookie. Used by ``qli login`` and the Electron app.'
      operationId: start_api_auth_workos_start_get
      parameters:
      - name: org_slug
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Slug
      - name: frontend_origin
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Frontend Origin
      - name: next
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
      - name: callback_port
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Callback Port
      - name: login_hint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Login Hint
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/workos/callback:
    get:
      tags:
      - workos
      summary: Callback
      description: Exchange the WorkOS code for a profile and finalise the session.
      operationId: callback_api_auth_workos_callback_get
      parameters:
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      - name: error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/workos/discover:
    get:
      tags:
      - workos
      summary: Discover
      description: 'Email-domain SSO routing.


        Looks up whether the email''s domain belongs to a WorkOS Organization

        that''s wired to one of our ``Organization`` rows. Returns the org

        slug + the ``/start`` URL the caller should redirect to. Returns

        ``{org_slug: null, login_url: null}`` when no SSO is configured for

        the domain — the caller falls back to global Google login.


        When the caller supplies ``frontend_origin``, it must match

        ``ALLOWED_FRONTEND_ORIGINS`` and is round-tripped into ``login_url``

        so hosted browser callers can redirect to ``/start`` without

        rebuilding the query string themselves.


        WorkOS is the source of truth for ``OrganizationDomain``; we keep no

        local copy. One WorkOS API call per discover, which is acceptable

        since users only click "Continue with SSO" at most once per login.'
      operationId: discover_api_auth_workos_discover_get
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 320
          title: Email
      - name: frontend_origin
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Frontend Origin
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/workos/webhook:
    post:
      tags:
      - workos
      summary: Webhook
      description: 'WorkOS event delivery endpoint.


        Subscribed events:

        * ``dsync.user.created`` — eager membership provisioning. Customer''s

        IdP pushed a new user via SCIM; create the local User +

        OrganizationMember rows so the user can sign in directly without

        an admin invite.

        * ``dsync.user.deleted`` — per-user revocation (offboard)

        * ``dsync.user.updated`` (state=inactive) — per-user revocation

        (suspend / disable; covers Okta DEPROVISIONED, Azure Disabled, etc.)

        * ``connection.deactivated`` / ``connection.deleted`` /

        ``dsync.deleted`` — org-wide revocation. Customer''s IT admin

        pulled the SSO plug; force-log-out every member of the affected

        organization (memberships preserved so a later reconnect lets

        them log back in).


        Idempotent on the WorkOS event id via ``processed_webhook_events``.'
      operationId: webhook_api_auth_workos_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    DiscoverResponse:
      properties:
        org_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Slug
        login_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Login Url
      type: object
      required:
      - org_slug
      - login_url
      title: DiscoverResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
